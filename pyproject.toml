[project]
name = "taller-dl"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "tqdm>=4.67.3",
    "torch<=2.11.0",
    "torchvision==0.24.0",
    "pytorch-triton-xpu<=3.5.0",
    "torchmetrics>=1.9.0",
    "medmnist>=3.0.2",
    "kagglehub>=1.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ruff>=0.15.12",
    "ty>=0.0.32",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-xpu" },
]
torchvision = [
    { index = "pytorch-xpu" },
]
pytorch-triton-xpu = [
    { index = "pytorch-xpu" },
]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
